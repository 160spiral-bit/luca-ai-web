    <script>
      
      (function () {
        var theme = null;
        try {
          var raw = localStorage.getItem("luca-onboarding");
          if (raw) {
            var p = JSON.parse(raw);
            if (p && p.complete === true && p.theme) theme = p.theme;
          }
          if (!theme) {
            var s = localStorage.getItem("luca-settings");
            if (s) {
              var sp = JSON.parse(s);
              if (sp && sp.theme) theme = sp.theme;
            }
          }
        } catch (e) {}
        if (!theme) {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <script>
      
      
      
      
      
      window.__lucaRenderMath = function() {
        if (!window.renderMathInElement) return;
        var root = document.getElementById('root');
        if (!root) return;
        try {
          renderMathInElement(root, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\[', right: '\\]', display: true},
              {left: '\\(', right: '\\)', display: false},
            ],
            throwOnError: false,
            ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
            ignoredClasses: ['code-block', 'font-mono'],
          });
        } catch (e) {}
      };
      window.__lucaRenderMermaid = function() {
        if (!window.mermaid) return;
        try { window.mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' }); } catch(e) {}
        var root = document.getElementById('root');
        if (!root) return;
        var blocks = root.querySelectorAll('pre code');
        var toRender = [];
        blocks.forEach(function(pre) {
          var text = pre.textContent || '';
          var m = text.match(/^\s*mermaid\s*\n([\s\S]+)/i);
          if (m && !pre.dataset.mermaidRendered) {
            toRender.push({ pre: pre, code: m[1].trim() });
          }
        });
        if (toRender.length === 0) return;
        toRender.forEach(function(item, idx) {
          item.pre.dataset.mermaidRendered = '1';
          var id = 'mermaid-' + Date.now() + '-' + idx;
          try {
            window.mermaid.render(id, item.code).then(function(result) {
              var container = document.createElement('div');
              container.className = 'mermaid-render my-3 flex justify-center overflow-x-auto';
              container.innerHTML = result.svg;
              item.pre.parentElement.replaceChild(container, item.pre);
            }).catch(function(e) {
              item.pre.textContent = item.code;
            });
          } catch(e) {
            item.pre.textContent = item.code;
          }
        });
      };
      window.addEventListener('load', function() {
        function setupMathObserver() {
          if (!window.renderMathInElement) {
            setTimeout(setupMathObserver, 300);
            return;
          }
          var renderTimer = null;
          function scheduleRender() {
            if (renderTimer) clearTimeout(renderTimer);
            renderTimer = setTimeout(function() {
              renderTimer = null;
              window.__lucaRenderMath();
              window.__lucaRenderMermaid();
            }, 150);
          }
          var observer = new MutationObserver(function() {
            scheduleRender();
          });
          observer.observe(document.getElementById('root') || document.body, {
            childList: true,
            subtree: true,
            characterData: true,
          });
          setTimeout(window.__lucaRenderMath, 500);
          setTimeout(window.__lucaRenderMermaid, 800);
          console.log('[Render] Math + Mermaid observers active');
        }
        setupMathObserver();
      });
    </script>
